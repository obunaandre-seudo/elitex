services:
  - type: web
    name: elite-x-shop-backend
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: DATABASE_URL_POOLER
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CORS_ORIGINS
        value: https://www.elitexshop.com,https://elitexshop.com,https://elitex-gmr5vr5ml-bae-224a.vercel.app,https://elitex-git-main-bae-224a.vercel.app,https://elitex-9ju7g5pk-bae-224a.vercel.app
      - key: CORS_ORIGIN_PATTERNS
        value: ^https:\/\/elitex(?:-[a-z0-9-]+)?-bae-224a\.vercel\.app$
      - key: FRONTEND_URL
        value: https://elitexshop.com
      - key: CLIENT_URL
        value: https://elitexshop.com
